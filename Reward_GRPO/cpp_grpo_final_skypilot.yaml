# Final cohort only: twenty updates using the pinned August 29 iter14 warm start.
# Render with scripts/launch_cpp_grpo_final.py; its preflight/data/image gates are required.
name: cpp-grpo-final-grpo20

workdir: .

num_nodes: 1

