setup: |
  set -euo pipefail
  : "${MILES_RUN_ID:?MILES_RUN_ID is required}"
  : "${GLM47_SOURCE_COMMIT:?GLM47_SOURCE_COMMIT is required}"
  python3 scripts/launch_cpp_grpo_final.py verify-stage

  if [ -L src/Reward_GRPO ]; then
    test "$(readlink src/Reward_GRPO)" = "../Reward_GRPO"
  elif [ -e src/Reward_GRPO ]; then
    echo "src/Reward_GRPO exists but is not the expected experiment-package link" >&2
    exit 2
  else
    ln -s ../Reward_GRPO src/Reward_GRPO
  fi
  PYTHONPATH=src python3 -c 'import Reward_GRPO.generalized_cpp_topic_grpo'

  python3 -m pip install --no-deps -e .
  python3 scripts/check_runtime.py
  apt-get update
  DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confold install -y --no-install-recommends docker.io rsync

  mapfile -t gpu_names < <(nvidia-smi --query-gpu=name --format=csv,noheader)
  test "${#gpu_names[@]}" -eq 8
  for gpu_name in "${gpu_names[@]}"; do [[ "${gpu_name}" == *H100* ]]; done
  command -v docker >/dev/null
  test -S /var/run/docker.sock
  docker info >/dev/null

  mkdir -p /workspace/local-models /workspace/local-checkpoints /workspace/local-runs
  rsync -a --exclude=".cache" --exclude=".git" /workspace/models/GLM-4.7-Flash/ "${MILES_HF_CHECKPOINT}/"
  test "$(tr -d '[:space:]' < "${MILES_HF_CHECKPOINT}/MODEL_REVISION")" = "${GLM47_MODEL_REVISION}"
  python3 scripts/launch_cpp_grpo_final.py model-catalog \
    --directory "${MILES_HF_CHECKPOINT}" --output /workspace/local-models/final-model-files.json \
    --model zai-org/GLM-4.7-Flash --revision "${GLM47_MODEL_REVISION}" \
    --source gs://skypilot-filemounts-ubuntu-f0048940-17eetwow/GLM-4.7-Flash
  PYTHONPATH=src python3 - <<'PYBRIDGE'
  import json, os
  from pathlib import Path
  import torch, ray
  from glm47_posttraining.integrations.miles_glm47_bridge import register_glm47_bridge
  register_glm47_bridge()
  import miles_plugins.mbridge
  from mbridge.core.bridge import _MODEL_REGISTRY
  config = json.loads((Path(os.environ["MILES_HF_CHECKPOINT"]) / "config.json").read_text())
  if config.get("model_type") != "glm4_moe_lite" or "glm4_moe_lite" not in _MODEL_REGISTRY:
      raise SystemExit("pinned GLM-4.7-Flash checkpoint/bridge mismatch")
  print("PINNED_GLM47_BRIDGE_READY", torch.__version__, ray.__version__)
  PYBRIDGE
  rsync -a /workspace/runs/shared/GLM-4.7-Flash_torch_dist_tp4_pp1_ep8/ "${MILES_REF_LOAD_DIR}/"
  test -f "${MILES_REF_LOAD_DIR}/latest_checkpointed_iteration.txt"

  source_adapter=/workspace/runs/generalized-cpp-kernel-grpo20-spot-20260829-083214-retry1/checkpoints/grpo_lora_r16/iter_0000014/adapter
  test "$(sha256sum "${source_adapter}/adapter_model.bin" | awk '{print $1}')" = "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"
  test "$(find "${source_adapter}" -maxdepth 1 -type f -name 'adapter_megatron_*.pt' | wc -l)" -eq "${MILES_EXPECTED_SOURCE_NATIVE_SHARDS}"
  mkdir -p "${MILES_LORA_SOURCE_ADAPTER_PATH}"
  rsync -a --include="adapter_model.bin" --include="adapter_config.json" --include="adapter_megatron_*.pt" --exclude="*" "${source_adapter}/" "${MILES_LORA_SOURCE_ADAPTER_PATH}/"
  test "$(sha256sum "${MILES_LORA_SOURCE_ADAPTER_PATH}/adapter_model.bin" | awk '{print $1}')" = "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"

  python3 - <<'PYVERIFY'
  import hashlib, json, os
  from pathlib import Path
  root = Path(os.environ["MILES_LORA_SOURCE_ADAPTER_PATH"])
  for name, expected in json.loads(os.environ["MILES_EXPECTED_WARMSTART_FILES"]).items():
      if hashlib.sha256((root / name).read_bytes()).hexdigest() != expected:
          raise SystemExit("warm-start file does not match evaluated checkpoint: " + name)
  print("GENERALIZED_AUG29_ITER14_WARMSTART_VERIFIED")
  PYVERIFY

  # Fail before generation/training if ADC, transport dependencies or bucket
  # read permission needed by the final durability barrier are unavailable.
  timeout --kill-after=5s 60s python3 scripts/verify_cpp_grpo_artifacts.py \
    --file "${MILES_LORA_SOURCE_ADAPTER_PATH}/adapter_config.json" \
    --bucket skypilot-filemounts-ubuntu-f0048940-88p8zkcq \
    --object generalized-cpp-kernel-grpo20-spot-20260829-083214-retry1/checkpoints/grpo_lora_r16/iter_0000014/adapter/adapter_config.json \
    --timeout 30

  if [ ! -f "${MILES_LORA_ADAPTER_PATH}/mtp_strip_manifest.json" ]; then
    test ! -e "${MILES_LORA_ADAPTER_PATH}" || test -z "$(find "${MILES_LORA_ADAPTER_PATH}" -mindepth 1 -print -quit)"
    python3 scripts/prepare_grpo_adapter.py \
      --include-native \
      --expected-native-shards "${MILES_EXPECTED_SOURCE_NATIVE_SHARDS}" \
      --expected-source-sha256 "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" \
      "${MILES_LORA_SOURCE_ADAPTER_PATH}" "${MILES_LORA_ADAPTER_PATH}"
  fi
  grep -q "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" "${MILES_LORA_ADAPTER_PATH}/mtp_strip_manifest.json"

  # Load the exact image which passed the full local gate, without rebuilding apt layers.
  docker load -i /workspace/final-verifier-image.tar
  docker tag "${FINAL_REWARD_IMAGE_ID}" "${GLM47_CPP_SANDBOX_IMAGE}"
  test "$(docker image inspect --format '{{.Id}}' "${GLM47_CPP_SANDBOX_IMAGE}")" = "${FINAL_REWARD_IMAGE_ID}"
  test "$(docker image inspect --format '{{index .Config.Labels "glm47.reward-contract"}}' "${GLM47_CPP_SANDBOX_IMAGE}")" = "${FINAL_REWARD_CONTRACT}"
  test -w /workspace/runs
  echo GENERALIZED_CPP_GRPO20_SETUP_READY

run: |
  set -euo pipefail
  mapfile -t gpu_names < <(nvidia-smi --query-gpu=name --format=csv,noheader)
  test "${#gpu_names[@]}" -eq 8
  for gpu_name in "${gpu_names[@]}"; do [[ "${gpu_name}" == *H100* ]]; done
  test "$(sha256sum "${MILES_LORA_SOURCE_ADAPTER_PATH}/adapter_model.bin" | awk '{print $1}')" = "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"
  grep -q "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" "${MILES_LORA_ADAPTER_PATH}/mtp_strip_manifest.json"
  test -f "${MILES_HF_CHECKPOINT}/config.json"
  test -f "${MILES_REF_LOAD_DIR}/latest_checkpointed_iteration.txt"
  docker image inspect "${GLM47_CPP_SANDBOX_IMAGE}" >/dev/null

  run_root="/workspace/local-runs/${MILES_RUN_ID}"
  artifact_root="/workspace/runs/${MILES_RUN_ID}"
  test ! -e "${run_root}"
  test ! -e "${artifact_root}"
  mkdir -p "${run_root}" "${artifact_root}"
  cp launch-manifest.json "${run_root}/launch-manifest.json"
  preserve_artifacts() {
    rsync -a --no-links "${run_root}/" "${artifact_root}/" || true
  }
  preserve_periodically() {
    while true; do
      sleep 60
      preserve_artifacts
    done
  }
  preserve_pid=""
  cleanup() {
    local pipeline_status=$?
    trap - EXIT
    if [ -n "${preserve_pid}" ]; then
      kill "${preserve_pid}" >/dev/null 2>&1 || true
      wait "${preserve_pid}" >/dev/null 2>&1 || true
      preserve_pid=""
    fi
    # Write status before the final copy. Reading back the cached mount alone
    # does not acknowledge that GCS has received these exact bytes.
    {
      echo "pipeline_status=${pipeline_status}"
      echo "source_commit=${GLM47_SOURCE_COMMIT}"
      echo "source_adapter_sha256=${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"
      echo "verifier_gate=cpp-grpo-final-v1"
      echo "reward_contract=${FINAL_REWARD_CONTRACT}"
      echo "reward_image=${FINAL_REWARD_IMAGE_ID}"
    } > "${run_root}/run_status.txt"
    local durability_status=0
    timeout --kill-after=5s 900s rsync -a --no-links "${run_root}/" "${artifact_root}/" || durability_status=$?
    local receipt="${run_root}.artifact-upload.json"
    if [ "${durability_status}" -eq 0 ]; then
      timeout --kill-after=5s 660s python3 scripts/verify_cpp_grpo_artifacts.py \
        --root "${run_root}" --bucket skypilot-filemounts-ubuntu-f0048940-88p8zkcq \
        --prefix "${MILES_RUN_ID}" --receipt "${receipt}" --timeout 600 || durability_status=$?
    fi
    if [ -f "${receipt}" ]; then
      timeout --kill-after=5s 60s cp "${receipt}" "${artifact_root}/artifact-upload.json" || durability_status=$?
      # Acknowledge the generation receipt too. Its own generation is printed to
      # SkyPilot logs, avoiding a recursively self-hashed receipt requirement.
      timeout --kill-after=5s 90s python3 scripts/verify_cpp_grpo_artifacts.py \
        --file "${receipt}" --bucket skypilot-filemounts-ubuntu-f0048940-88p8zkcq \
        --object "${MILES_RUN_ID}/artifact-upload.json" --timeout 60 || durability_status=$?
    fi
    if [ "${durability_status}" -ne 0 ]; then
      echo "ARTIFACT_DURABILITY_FAILED status=${durability_status} pipeline_status=${pipeline_status}" >&2
      exit 3
    fi
    echo "CPP_GRPO_ARTIFACTS_DURABLE ${artifact_root}"
    exit "${pipeline_status}"
  }
  trap cleanup EXIT
  preserve_periodically &
  preserve_pid=$!

  export MILES_RUN_ROOT="${run_root}"
  export GENERALIZED_CPP_FAILURE_DIR="${run_root}/reward_failures"
  export MILES_CPP_DATA_DIR="${run_root}/data"
  export GLM47_EXPERIMENT_ID="${MILES_RUN_ID}"
  export MILES_WANDB_GROUP="${MILES_RUN_ID}"
  export MILES_WANDB_RUN_ID="${MILES_RUN_ID}"
  export WANDB_RUN_GROUP="${MILES_RUN_ID}"
  export MILES_APPLY_CHAT_TEMPLATE_KWARGS='{"enable_thinking": true}'

  # Download the exact published revision and authenticate every file and row.
  PYTHONPATH=src python3 scripts/launch_cpp_grpo_final.py fetch-data \
    --record launch-manifest.json --out "${MILES_CPP_DATA_DIR}"
  test -f "${MILES_CPP_DATA_DIR}/grpo/train.jsonl"
  test -f "${MILES_CPP_DATA_DIR}/eval/validation.jsonl"
  cp /workspace/local-models/final-model-files.json "${run_root}/model-files.json"
  mapfile -t dataset_pin < <(python3 - <<'PYPIN'
  import json
  record = json.load(open("launch-manifest.json"))
  print(record["dataset"]["repo"])
  print(record["dataset"]["revision"])
  PYPIN
  )
  evaluate_checkpoint() {
    local adapter_path="$1" checkpoint_id="$2" label="$3"
    PYTHONPATH=src python3 -B scripts/evaluate_cpp_grpo_final.py \
      --data-dir "${MILES_CPP_DATA_DIR}" --dataset-repo "${dataset_pin[0]}" \
      --dataset-revision "${dataset_pin[1]}" \
      --model zai-org/GLM-4.7-Flash --model-revision "${GLM47_MODEL_REVISION}" \
      --model-path "${MILES_HF_CHECKPOINT}" --model-file-manifest "${run_root}/model-files.json" \
      --adapter "${adapter_path}" --checkpoint-id "${checkpoint_id}" --label "${label}" \
      --output-dir "${run_root}/evaluation/${label}" --trials 3 --seed 20260916 \
      --temperature 0.7 --max-tokens 8192 --tp-size 4 --mem-fraction-static 0.7 \
      --sandbox-image "${GLM47_CPP_SANDBOX_IMAGE}"
  }
  # New matched generation, not historical replay. Any INVALID stops before training.
  evaluate_checkpoint "${MILES_LORA_ADAPTER_PATH}" \
    generalized-cpp-kernel-grpo20-spot-20260829-083214-retry1/iter_0000014 warmstart

  set +e
  bash examples/grpo.sh
  train_status=$?
  set -e

  final_adapter=""
  if [ "${train_status}" -eq 0 ]; then
    final_iteration=$((MILES_NUM_ROLLOUT - 1))
    printf -v final_checkpoint 'iter_%07d' "${final_iteration}"
    final_adapter="${run_root}/checkpoints/grpo_lora_r16/${final_checkpoint}/adapter"
    test -f "${final_adapter}/adapter_model.bin"
    test "$(find "${final_adapter}" -maxdepth 1 -type f -name 'adapter_megatron_*.pt' | wc -l)" -eq "${MILES_EXPECTED_NATIVE_SHARDS}"
    test -f "${run_root}/grpo_lora_r16/grpo_training_gate.json"
    ADAPTER_PATH="${final_adapter}" python3 - <<'PY'
  import hashlib
  import json
  import os
  from pathlib import Path
  import torch

  root = Path(os.environ["ADAPTER_PATH"])
  files = [root / "adapter_model.bin", *sorted(root.glob("adapter_megatron_*.pt"))]
  checked = 0
  nonfinite = []
  for path in files:
      state = torch.load(path, map_location="cpu", weights_only=False)
      stack = [(path.name, state)]
      while stack:
          label, value = stack.pop()
          if isinstance(value, torch.Tensor):
              checked += 1
              if not torch.isfinite(value).all().item():
                  nonfinite.append(label)
          elif isinstance(value, dict):
              stack.extend((f"{label}.{key}", item) for key, item in value.items())
          elif isinstance(value, (list, tuple)):
              stack.extend((f"{label}[{index}]", item) for index, item in enumerate(value))
  if nonfinite:
      raise SystemExit(f"non-finite tensors: {nonfinite[:20]}")
  model = root / "adapter_model.bin"
  receipt = {
      "status": "passed",
      "adapter_model_sha256": hashlib.sha256(model.read_bytes()).hexdigest(),
      "files_checked": [path.name for path in files],
      "tensors_checked": checked,
      "nonfinite_tensors": 0,
  }
  (root / "finiteness_receipt.json").write_text(
      json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
  )
  print("GENERALIZED_CPP_FINAL_ADAPTER_FINITE", json.dumps(receipt, sort_keys=True))
  PY
    # Keep the original checkpoint intact; omit only non-served MTP layers using
    # the same preparation utility as the warm-start baseline.
    eval_adapter="${run_root}/evaluation-adapters/${final_checkpoint}"
    python3 scripts/prepare_grpo_adapter.py "${final_adapter}" "${eval_adapter}"
    evaluate_checkpoint "${eval_adapter}" "${MILES_RUN_ID}/${final_checkpoint}" trained
  fi

  # The EXIT handler stops the periodic writer and verifies durable GCS objects
  # for both success and failure paths before allowing automatic teardown.
  exit "${train_status}"
