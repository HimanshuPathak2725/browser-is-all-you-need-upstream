  /workspace/models:
    source: gs://skypilot-filemounts-ubuntu-f0048940-17eetwow
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RO
    config:
      mount_cached:
        vfs_cache_max_size: 100G
  /workspace/assets:
    source: gs://skypilot-filemounts-ubuntu-f0048940-4e9fav0c
    mode: MOUNT_CACHED
    type: DATASET_RO
    config:
      mount_cached:
        vfs_cache_max_size: 25G
  /workspace/runs:
    source: gs://skypilot-filemounts-ubuntu-f0048940-88p8zkcq
    mode: MOUNT_CACHED
    type: MODEL_CHECKPOINT_RW
    config:
      mount_cached:
        vfs_cache_max_size: 200G

setup: |
  set -euo pipefail
  : "${MILES_RUN_ID:?MILES_RUN_ID is required}"
  : "${GLM47_SOURCE_COMMIT:?GLM47_SOURCE_COMMIT is required}"

  if [ -L src/Reward_GRPO ]; then
    test "$(readlink src/Reward_GRPO)" = "../Reward_GRPO"
  elif [ -e src/Reward_GRPO ]; then
    echo "src/Reward_GRPO exists but is not the expected experiment-package link" >&2
    exit 2
  else
    ln -s ../Reward_GRPO src/Reward_GRPO
  fi
  PYTHONPATH=src python3 -c 'import Reward_GRPO.generalized_cpp_topic_grpo'

  python3 -m pip install --no-deps -e .
  python3 scripts/check_runtime.py
  apt-get update
  DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confold install -y --no-install-recommends docker.io rsync

  mapfile -t gpu_names < <(nvidia-smi --query-gpu=name --format=csv,noheader)
  test "${#gpu_names[@]}" -eq 8
  for gpu_name in "${gpu_names[@]}"; do [[ "${gpu_name}" == *H100* ]]; done
  command -v docker >/dev/null
  test -S /var/run/docker.sock
  docker info >/dev/null

  mkdir -p /workspace/local-models /workspace/local-checkpoints /workspace/local-runs
  rsync -a /workspace/models/GLM-4.7-Flash/ "${MILES_HF_CHECKPOINT}/"
  test "$(tr -d '[:space:]' < "${MILES_HF_CHECKPOINT}/MODEL_REVISION")" = "${GLM47_MODEL_REVISION}"
  PYTHONPATH=src python3 -m glm47_posttraining.integrations.charm_bridge_preflight \
    --root "$PWD" --checkpoint "${MILES_HF_CHECKPOINT}" --with-ray
  rsync -a /workspace/runs/shared/GLM-4.7-Flash_torch_dist_tp4_pp1_ep8/ "${MILES_REF_LOAD_DIR}/"
  test -f "${MILES_REF_LOAD_DIR}/latest_checkpointed_iteration.txt"

  source_adapter=/workspace/runs/generalized-cpp-kernel-grpo20-spot-20260829-083214-retry1/checkpoints/grpo_lora_r16/iter_0000014/adapter
  test "$(sha256sum "${source_adapter}/adapter_model.bin" | awk '{print $1}')" = "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"
  test "$(find "${source_adapter}" -maxdepth 1 -type f -name 'adapter_megatron_*.pt' | wc -l)" -eq "${MILES_EXPECTED_SOURCE_NATIVE_SHARDS}"
  mkdir -p "${MILES_LORA_SOURCE_ADAPTER_PATH}"
  rsync -a --include="adapter_model.bin" --include="adapter_config.json" --include="adapter_megatron_*.pt" --exclude="*" "${source_adapter}/" "${MILES_LORA_SOURCE_ADAPTER_PATH}/"
  test "$(sha256sum "${MILES_LORA_SOURCE_ADAPTER_PATH}/adapter_model.bin" | awk '{print $1}')" = "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"

  python3 - <<'PYVERIFY'
  import hashlib, json, os
  from pathlib import Path
  root = Path(os.environ["MILES_LORA_SOURCE_ADAPTER_PATH"])
  for name, expected in json.loads(os.environ["MILES_EXPECTED_WARMSTART_FILES"]).items():
      if hashlib.sha256((root / name).read_bytes()).hexdigest() != expected:
          raise SystemExit("warm-start file does not match evaluated checkpoint: " + name)
  print("GENERALIZED_AUG29_ITER14_WARMSTART_VERIFIED")
  PYVERIFY

  if [ ! -f "${MILES_LORA_ADAPTER_PATH}/mtp_strip_manifest.json" ]; then
    test ! -e "${MILES_LORA_ADAPTER_PATH}" || test -z "$(find "${MILES_LORA_ADAPTER_PATH}" -mindepth 1 -print -quit)"
    python3 scripts/prepare_grpo_adapter.py \
      --include-native \
      --expected-native-shards "${MILES_EXPECTED_SOURCE_NATIVE_SHARDS}" \
      --expected-source-sha256 "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" \
      "${MILES_LORA_SOURCE_ADAPTER_PATH}" "${MILES_LORA_ADAPTER_PATH}"
  fi
  grep -q "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" "${MILES_LORA_ADAPTER_PATH}/mtp_strip_manifest.json"

  PYTHONPATH=src python3 -m Reward_GRPO.generalized_cpp_topic_grpo build-image
  test -w /workspace/runs
  echo GENERALIZED_CPP_GRPO20_SETUP_READY

run: |
  set -euo pipefail
  mapfile -t gpu_names < <(nvidia-smi --query-gpu=name --format=csv,noheader)
  test "${#gpu_names[@]}" -eq 8
  for gpu_name in "${gpu_names[@]}"; do [[ "${gpu_name}" == *H100* ]]; done
  test "$(sha256sum "${MILES_LORA_SOURCE_ADAPTER_PATH}/adapter_model.bin" | awk '{print $1}')" = "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"
  grep -q "${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}" "${MILES_LORA_ADAPTER_PATH}/mtp_strip_manifest.json"
  test -f "${MILES_HF_CHECKPOINT}/config.json"
  test -f "${MILES_REF_LOAD_DIR}/latest_checkpointed_iteration.txt"
  docker image inspect "${GLM47_CPP_SANDBOX_IMAGE}" >/dev/null

  run_root="/workspace/local-runs/${MILES_RUN_ID}"
  artifact_root="/workspace/runs/${MILES_RUN_ID}"
  test ! -e "${run_root}"
  test ! -e "${artifact_root}"
  mkdir -p "${run_root}" "${artifact_root}"
  cp launch-manifest.json "${run_root}/launch-manifest.json"
  preserve_artifacts() {
    rsync -a --no-links "${run_root}/" "${artifact_root}/" || true
  }
  preserve_periodically() {
    while true; do
      sleep 60
      preserve_artifacts
    done
  }
  preserve_pid=""
  cleanup() {
    if [ -n "${preserve_pid}" ]; then
      kill "${preserve_pid}" >/dev/null 2>&1 || true
      wait "${preserve_pid}" >/dev/null 2>&1 || true
      preserve_pid=""
    fi
    preserve_artifacts
  }
  trap cleanup EXIT
  preserve_periodically &
  preserve_pid=$!

  export MILES_RUN_ROOT="${run_root}"
  export GENERALIZED_CPP_FAILURE_DIR="${run_root}/reward_failures"
  export MILES_CPP_DATA_DIR="${run_root}/data"
  export GLM47_EXPERIMENT_ID="${MILES_RUN_ID}"
  export MILES_WANDB_GROUP="${MILES_RUN_ID}"
  export MILES_WANDB_RUN_ID="${MILES_RUN_ID}"
  export WANDB_RUN_GROUP="${MILES_RUN_ID}"
  export MILES_APPLY_CHAT_TEMPLATE_KWARGS='{"enable_thinking": true}'

  PYTHONPATH=src python3 -m Reward_GRPO.generalized_cpp_topic_grpo \
    build-data \
    --tasks-dir Reward_GRPO \
    --out "${MILES_CPP_DATA_DIR}" \
    --curriculum generalized-cpp-topics-v1 \
    --profile generalized-cpp-topics-grpo20 \
    --run-id "${MILES_RUN_ID}" \
    --force

  set +e
  bash examples/grpo.sh
  train_status=$?
  set -e

  final_adapter=""
  if [ "${train_status}" -eq 0 ]; then
    final_iteration=$((MILES_NUM_ROLLOUT - 1))
    printf -v final_checkpoint 'iter_%07d' "${final_iteration}"
    final_adapter="${run_root}/checkpoints/grpo_lora_r16/${final_checkpoint}/adapter"
    test -f "${final_adapter}/adapter_model.bin"
    test "$(find "${final_adapter}" -maxdepth 1 -type f -name 'adapter_megatron_*.pt' | wc -l)" -eq "${MILES_EXPECTED_NATIVE_SHARDS}"
    test -f "${run_root}/grpo_lora_r16/grpo_training_gate.json"
    ADAPTER_PATH="${final_adapter}" python3 - <<'PY'
  import hashlib
  import json
  import os
  from pathlib import Path
  import torch

  root = Path(os.environ["ADAPTER_PATH"])
  files = [root / "adapter_model.bin", *sorted(root.glob("adapter_megatron_*.pt"))]
  checked = 0
  nonfinite = []
  for path in files:
      state = torch.load(path, map_location="cpu", weights_only=False)
      stack = [(path.name, state)]
      while stack:
          label, value = stack.pop()
          if isinstance(value, torch.Tensor):
              checked += 1
              if not torch.isfinite(value).all().item():
                  nonfinite.append(label)
          elif isinstance(value, dict):
              stack.extend((f"{label}.{key}", item) for key, item in value.items())
          elif isinstance(value, (list, tuple)):
              stack.extend((f"{label}[{index}]", item) for index, item in enumerate(value))
  if nonfinite:
      raise SystemExit(f"non-finite tensors: {nonfinite[:20]}")
  model = root / "adapter_model.bin"
  receipt = {
      "status": "passed",
      "adapter_model_sha256": hashlib.sha256(model.read_bytes()).hexdigest(),
      "files_checked": [path.name for path in files],
      "tensors_checked": checked,
      "nonfinite_tensors": 0,
  }
  (root / "finiteness_receipt.json").write_text(
      json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
  )
  print("GENERALIZED_CPP_FINAL_ADAPTER_FINITE", json.dumps(receipt, sort_keys=True))
  PY
  fi

  kill "${preserve_pid}" >/dev/null 2>&1 || true
  wait "${preserve_pid}" >/dev/null 2>&1 || true
  preserve_pid=""
  rsync -a --no-links "${run_root}/" "${artifact_root}/"
  test -f "${artifact_root}/grpo_lora_r16/run.log"
  if [ -n "${final_adapter}" ]; then
    test -f "${artifact_root}/checkpoints/grpo_lora_r16/${final_checkpoint}/adapter/finiteness_receipt.json"
  fi
  {
    echo "train_status=${train_status}"
    echo "source_commit=${GLM47_SOURCE_COMMIT}"
    echo "source_adapter_sha256=${MILES_EXPECTED_SOURCE_ADAPTER_SHA256}"
    echo "data_build_module=${MILES_DATA_BUILD_MODULE}"
    echo "reward_func=${MILES_CUSTOM_RM_PATH}"
    echo "source_run=generalized-cpp-kernel-grpo20-spot-20260829-083214-retry1"
    echo "source_iteration=14"
    echo "verifier_gate=generalized-cpp-topics-v1"
    echo "thinking=true"
  } > "${artifact_root}/run_status.txt"
  echo "GENERALIZED_CPP_GRPO20_ARTIFACTS_PRESERVED ${artifact_root}"
  trap - EXIT
  exit "${train_status}"
