# Twenty-update generalized C++ GRPO with eleven topic gates, warm-started from the saved
# evaluated Generalized C++ GRPO checkpoint (August 29 iter 14; selected-four mean 11.75/26).
# The experiment owns its verifier registry, reward adapter, artifact staging,
# and final receipt without modifying shared infrastructure or trainer code.
name: generalized-cpp-topics-grpo20

workdir: .

num_nodes: 1

resources:
  infra: gcp
  instance_type: a3-highgpu-8g
  accelerators: H100:8
  image_id: docker:ghcr.io/tokenbender/glm47-runtime@sha256:b4f67ba1519bf276fe1dcb6fcb457600e4a256bc0d5c3011fcbd9cc05f240d43
  use_spot: true
  disk_size: 500
  disk_tier: high
  autostop:
    idle_minutes: 30
    down: true
    wait_for: jobs
  labels:
    managed-by: skypilot
    workload: generalized-cpp-topics-grpo20

